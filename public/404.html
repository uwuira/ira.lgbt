<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404</title>
  <style>
    :root { color-scheme: dark; --pink: #ff8fc7; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #000; color: #eee; font: 16px/1.6 system-ui, sans-serif; }
    main { width: min(520px, calc(100% - 36px)); }
    h1 { margin: 0 0 8px; font-size: 4rem; color: var(--pink); }
    p { color: #aaa; }
    a { color: var(--pink); text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>sad</p>
    <a href="/">← go back home</a>
  </main>
</body>
</html>
