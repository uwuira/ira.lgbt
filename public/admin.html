<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>inbox — ira.lgbt</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/favicon.jpg" type="image/jpg">
  <meta name="theme-color" content="#ff8fc7">
  <style>
    :root { color-scheme: dark; --pink: #ff8fc7; --muted: #9a9a9a; --line: #232323; --card: #101010; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #000; color: #eee; font: 15px/1.6 system-ui, sans-serif; }
    main { width: min(760px, calc(100% - 32px)); margin: 40px auto 80px; }
    h1 { font-size: 1.6rem; margin: 0 0 4px; }
    h2 { font-size: 1rem; color: var(--pink); margin: 40px 0 12px; }
    a { color: var(--pink); }
    .muted { color: var(--muted); font-size: 0.85rem; }
    .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

    button { font: inherit; font-size: 0.82rem; padding: 5px 11px; border-radius: 6px;
             border: 1px solid var(--line); background: #171717; color: #ddd; cursor: pointer; }
    button:hover { border-color: var(--pink); color: var(--pink); }
    button:disabled { opacity: 0.45; cursor: default; border-color: var(--line); color: #ddd; }
    button.danger:hover { border-color: #ff6b6b; color: #ff6b6b; }

    .card { border: 1px solid var(--line); background: var(--card); border-radius: 10px;
            padding: 14px 16px; margin-bottom: 12px; }
    .card .text { white-space: pre-wrap; overflow-wrap: anywhere; margin: 8px 0; }
    .card img { max-width: 100%; border-radius: 8px; background: #0d0d0d; margin: 8px 0; display: block; }
    .ids { font-family: ui-monospace, monospace; font-size: 0.76rem; color: var(--muted);
           overflow-wrap: anywhere; }
    .actions { margin-top: 10px; }

    .block { display: flex; justify-content: space-between; align-items: center; gap: 12px;
             border-bottom: 1px solid var(--line); padding: 9px 0; }
    .block code { font-size: 0.78rem; overflow-wrap: anywhere; }
    .empty { color: var(--muted); padding: 20px 0; }
    dialog.reply-image { width: fit-content; max-width: min(680px, calc(100vw - 32px)); padding: 0; overflow: hidden;
                          border: 1px solid var(--line); border-radius: 14px; background: #101010; color: #eee; }
    dialog.reply-image::backdrop { background: rgb(0 0 0 / 78%); backdrop-filter: blur(4px); }
    .reply-image-head { display: flex; align-items: center; justify-content: space-between; gap: 12px;
                         padding: 13px 16px; border-bottom: 1px solid var(--line); }
    .reply-image-head p { margin: 0; color: var(--muted); font-size: 0.85rem; }
    .reply-image-close { padding: 2px 8px; font-size: 1.2rem; line-height: 1; }
    .reply-image-preview { display: block; width: auto; height: auto; max-width: min(680px, calc(100vw - 32px));
                            max-height: calc(100vh - 220px); background: #080808; }
    .reply-image-actions { display: flex; align-items: center; justify-content: flex-end; gap: 12px;
                           padding: 12px 16px; border-top: 1px solid var(--line); }
  </style>
</head>
<body>
  <main>
    <h1>inbox</h1>
    <p class="muted" id="summary">loading…</p>

    <div class="row">
      <button id="refresh">refresh</button>
      <button id="seen">mark all read</button>
    </div>

    <h2>messages</h2>
    <div id="submissions"><p class="empty">loading…</p></div>
    <button id="more" hidden>load more</button>

    <h2>blocked</h2>
    <div id="blocks"><p class="empty">loading…</p></div>
  </main>
  <dialog class="reply-image" id="reply-image-dialog" aria-labelledby="reply-image-title">
    <div class="reply-image-head">
      <p id="reply-image-title">reply image</p>
      <form method="dialog"><button class="reply-image-close" aria-label="close reply image">×</button></form>
    </div>
    <img class="reply-image-preview" id="reply-image-preview" alt="ready-to-share inbox message image">
    <div class="reply-image-actions">
      <button id="download-reply-image">download PNG</button>
    </div>
  </dialog>


  <script type="module">
    const $ = (id) => document.getElementById(id);
    const submissionsEl = $("submissions");
    const blocksEl = $("blocks");

    let cursor = null;
    const replyImageDialog = $("reply-image-dialog");
    const replyImagePreview = $("reply-image-preview");
    const downloadReplyImage = $("download-reply-image");
    let replyImageUrl = null;

    function roundedRect(context, x, y, width, height, radius) {
      const r = Math.min(radius, width / 2, height / 2);
      context.beginPath();
      context.moveTo(x + r, y);
      context.arcTo(x + width, y, x + width, y + height, r);
      context.arcTo(x + width, y + height, x, y + height, r);
      context.arcTo(x, y + height, x, y, r);
      context.arcTo(x, y, x + width, y, r);
      context.closePath();
    }

    function wrapText(context, text, maxWidth) {
      const fits = (line) => context.measureText(line.trimEnd()).width <= maxWidth;

      // Only reached by a word too long for a line of its own: it has to be
      // broken somewhere, so break it by character.
      const breakWord = (word) => {
        const parts = [];
        let part = "";
        for (const character of word) {
          if (part && !fits(part + character)) {
            parts.push(part);
            part = character;
          } else {
            part += character;
          }
        }
        parts.push(part);
        return parts;
      };

      const lines = [];
      for (const paragraph of text.split(/\r?\n/)) {
        let line = "";
        // Words carry their trailing spaces along, so wrapping keeps whatever
        // spacing the sender typed.
        for (const word of paragraph.match(/\s*\S+\s*/g) ?? []) {
          if (line && !fits(line + word)) {
            lines.push(line.trimEnd());
            line = word.trimStart();
          } else {
            line += word;
          }

          if (!fits(line)) {
            const parts = breakWord(line);
            line = parts.pop();
            for (const part of parts) lines.push(part.trimEnd());
          }
        }
        lines.push(line.trimEnd());
      }
      return lines;
    }

    const stampText = (ms) =>
      new Date(ms).toLocaleString("en-GB", {
        day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit",
      });

    const loadImage = (src) =>
      new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => resolve(image);
        image.onerror = () => reject(new Error("the drawing could not be loaded"));
        image.src = src;
      });

    async function replyImage(submission) {
      const drawing = submission.drawingUrl ? await loadImage(submission.drawingUrl) : null;
      const canvas = document.createElement("canvas");
      const width = 1200;
      const padding = 72;
      const contentWidth = width - padding * 2;
      const measure = canvas.getContext("2d");
      const textSize = submission.text?.length > 420 ? 36 : 44;
      const lineHeight = Math.round(textSize * 1.42);
      measure.font = `500 ${textSize}px system-ui, sans-serif`;
      const lines = submission.text ? wrapText(measure, submission.text, contentWidth) : [];

      const maxDrawingHeight = 960;
      const drawingScale = drawing
        ? Math.min(contentWidth / drawing.naturalWidth, maxDrawingHeight / drawing.naturalHeight)
        : 0;
      const drawingWidth = drawing ? Math.round(drawing.naturalWidth * drawingScale) : 0;
      const drawingHeight = drawing ? Math.round(drawing.naturalHeight * drawingScale) : 0;
      const textHeight = lines.length * lineHeight;
      const contentHeight = (lines.length ? textHeight : 0) + (drawing ? drawingHeight : 0) +
        (lines.length && drawing ? 48 : 0);
      const height = padding + 58 + 32 + contentHeight + 74 + padding;

      canvas.width = width;
      canvas.height = height;
      const context = canvas.getContext("2d");

      context.fillStyle = "#000";
      context.fillRect(0, 0, width, height);

      context.fillStyle = "#ff8fc7";
      context.font = "700 34px system-ui, sans-serif";
      context.fillText("ira.lgbt", padding, padding + 26);
      context.textAlign = "right";
      context.fillStyle = "#fff";
      context.font = "700 34px system-ui, sans-serif";
      context.fillText("anonymous inbox", width - padding, padding + 26);
      context.textAlign = "left";

      context.fillStyle = "rgb(255 143 199 / 62%)";
      context.fillRect(padding, padding + 56, contentWidth, 2);

      let y = padding + 122;
      if (lines.length) {
        context.fillStyle = "#fff8fc";
        context.font = `500 ${textSize}px system-ui, sans-serif`;
        for (const line of lines) {
          context.fillText(line, padding, y);
          y += lineHeight;
        }
      }

      if (drawing) {
        y += lines.length ? 48 : 0;
        const x = padding + (contentWidth - drawingWidth) / 2;
        roundedRect(context, x, y, drawingWidth, drawingHeight, 20);
        context.save();
        context.clip();
        context.drawImage(drawing, x, y, drawingWidth, drawingHeight);
        context.restore();
        context.strokeStyle = "rgb(255 255 255 / 18%)";
        context.lineWidth = 2;
        roundedRect(context, x, y, drawingWidth, drawingHeight, 20);
        context.stroke();
      }

      context.fillStyle = "#fff";
      context.font = "700 34px system-ui, sans-serif";
      context.fillText(stampText(submission.createdAt), padding, height - padding + 10);

      const blob = await new Promise((resolve) => canvas.toBlob(resolve, "image/png"));
      if (!blob) throw new Error("the image could not be created");
      return { url: URL.createObjectURL(blob), width, height };
    }

    function clearReplyImage() {
      if (replyImageUrl) URL.revokeObjectURL(replyImageUrl);
      replyImageUrl = null;
      replyImagePreview.removeAttribute("src");
      replyImagePreview.style.removeProperty("width");
    }

    replyImageDialog.addEventListener("close", clearReplyImage);
    downloadReplyImage.onclick = () => {
      const link = el("a", { href: replyImagePreview.src, download: "ira-inbox-reply.png" });
      document.body.append(link);
      link.click();
      link.remove();
    };


    const api = async (path, options) => {
      const res = await fetch(path, { credentials: "same-origin", ...options });
      if (!res.ok) throw new Error(`${path} → ${res.status}`);
      return res.json();
    };

    const post = (path, body) =>
      api(path, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify(body ?? {}),
      });

    const el = (tag, props = {}, children = []) => {
      const node = Object.assign(document.createElement(tag), props);
      for (const child of children) node.append(child);
      return node;
    };

    const when = (ms) => {
      const date = new Date(ms);
      const mins = Math.round((Date.now() - ms) / 60000);
      const ago =
        mins < 1 ? "just now"
        : mins < 60 ? `${mins}m ago`
        : mins < 1440 ? `${Math.round(mins / 60)}h ago`
        : `${Math.round(mins / 1440)}d ago`;
      return `${ago} · ${date.toLocaleString()}`;
    };

    const headerText = (s) =>
      `${when(s.createdAt)} · ${s.readAt ? "read" : "unread"}`;

    const readLabel = (s) => (s.readAt ? "mark unread" : "mark read");

    function card(submission) {
      const node = el("div", { className: `card${submission.readAt ? "" : " unread"}` });

      const header = el("div", { className: "muted", textContent: headerText(submission) });
      node.append(header);

      // textContent, never innerHTML — this is text a stranger wrote.
      if (submission.text) node.append(el("div", { className: "text", textContent: submission.text }));

      if (submission.drawingUrl) {
        node.append(el("img", { src: submission.drawingUrl, alt: "drawing", loading: "lazy" }));
      }

      node.append(
        el("div", {
          className: "ids",
          textContent: `sender ${submission.senderId} · ip ${submission.ipHash}`,
        }),
      );

      const blockSender = el("button", { textContent: "block sender" });

      const makeReplyImage = el("button", { textContent: "make reply image" });
      makeReplyImage.onclick = async () => {
        makeReplyImage.disabled = true;
        try {
          const image = await replyImage(submission);
          replyImageUrl = image.url;
          const maxWidth = Math.min(680, window.innerWidth - 32);
          const maxHeight = Math.max(1, window.innerHeight - 220);
          replyImagePreview.style.width =
            `${Math.min(maxWidth, Math.round(maxHeight * image.width / image.height))}px`;
          replyImagePreview.src = replyImageUrl;
          replyImageDialog.showModal();
        } catch (error) {
          alert(`couldn't make reply image: ${error.message}`);
        } finally {
          makeReplyImage.disabled = false;
        }
      };

      blockSender.onclick = () => doBlock("sender", submission.senderId);

      const blockIp = el("button", { textContent: "block ip" });
      blockIp.onclick = () => doBlock("ip", submission.ipHash);

      const remove = el("button", { textContent: "delete", className: "danger" });
      remove.onclick = async () => {
        if (!confirm("delete this?")) return;
        await api(`/admin/api/submissions/${submission.id}`, { method: "DELETE" });
        reload();
      };

      const toggleRead = el("button", { textContent: readLabel(submission) });
      toggleRead.onclick = async () => {
        toggleRead.disabled = true;
        try {
          // The card is updated in place rather than reloading the list, so
          // marking something read does not throw away your scroll position
          // or whatever you had already paged in.
          const data = await post(`/admin/api/submissions/${submission.id}/read`, {
            read: !submission.readAt,
          });

          submission.readAt = data.readAt;
          header.textContent = headerText(submission);
          toggleRead.textContent = readLabel(submission);
          node.className = `card${submission.readAt ? "" : " unread"}`;
          $("summary").textContent = `${data.unread} unread`;
        } finally {
          toggleRead.disabled = false;
        }
      };

      node.append(
        el("div", { className: "row actions" }, [makeReplyImage, toggleRead, blockSender, blockIp, remove]),
      );
      return node;
    }

    async function doBlock(kind, value) {
      const note = prompt(`note for this ${kind} block (optional)`) ?? "";
      await post("/admin/api/block", { kind, value, note });
      loadBlocks();
    }

    async function loadSubmissions(append = false) {
      const query = new URLSearchParams({ limit: "25" });
      if (append && cursor) query.set("cursor", cursor);

      const data = await api(`/admin/api/submissions?${query}`);
      cursor = data.cursor;

      if (!append) submissionsEl.replaceChildren();
      if (!data.submissions.length && !append) {
        submissionsEl.append(el("p", { className: "empty", textContent: "nothing yet" }));
      }
      for (const submission of data.submissions) submissionsEl.append(card(submission));

      $("more").hidden = !cursor;
      $("summary").textContent = `${data.unread} unread`;
    }

    async function loadBlocks() {
      const { blocks } = await api("/admin/api/blocks");
      blocksEl.replaceChildren();

      if (!blocks.length) {
        blocksEl.append(el("p", { className: "empty", textContent: "nobody" }));
        return;
      }

      for (const entry of blocks) {
        const label = el("div", {}, [
          el("code", { textContent: `${entry.kind}: ${entry.value}` }),
          el("div", { className: "muted", textContent: entry.note || "" }),
        ]);

        const undo = el("button", { textContent: "unblock" });
        undo.onclick = async () => {
          await post("/admin/api/unblock", { kind: entry.kind, value: entry.value });
          loadBlocks();
        };

        blocksEl.append(el("div", { className: "block" }, [label, undo]));
      }
    }

    const reload = () => {
      cursor = null;
      return Promise.all([loadSubmissions(), loadBlocks()]).catch((error) => {
        $("summary").textContent = `something broke: ${error.message}`;
      });
    };

    $("refresh").onclick = reload;
    $("more").onclick = () => loadSubmissions(true);
    $("seen").onclick = async () => {
      await post("/admin/api/seen");
      reload();
    };

    reload();
  </script>
</body>
</html>
